<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · WhatsApp Campaign Studio</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-logo">💬</div>
    <h1>WhatsApp Campaign Studio</h1>
    <p class="muted">Sign in to continue</p>
    <form id="loginForm" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter admin password" autofocus />
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
      <p id="loginError" class="form-error" hidden></p>
    </form>
    <p class="muted small">AskMyCFO · secured access</p>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        const data = await res.json();
        if (data.ok) { window.location.href = '/'; return; }
        err.textContent = data.error || 'Sign in failed';
        err.hidden = false;
      } catch (_) {
        err.textContent = 'Network error — try again.';
        err.hidden = false;
      } finally {
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
